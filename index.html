
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Keith Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Keith Generator✨</h1>
    <p>What 'Keith' are you feeling?.</p>
  </header>

  <main>
    <section class="preview">
      <h2>Kieth</h2>

      <div class="avatar-stage">
        <canvas id="avatarCanvas" width="1024" height="1024"></canvas>
      </div>

      <div class="actions">
        <button id="randomize">🎲 Randomize</button>
        <button id="reset">Reset</button>
        <button id="download">Download PNG</button>
      </div>
    </section>

    <section class="customizer">
      <h2>Customize</h2>
      <div id="controls"></div>
    </section>
  </main>

  <footer>
    <p>Here's your Keith</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
