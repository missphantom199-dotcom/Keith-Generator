<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title> The Keith Generator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1> The Keith Studio</h1>
      <p> Create your Keith</p>
    </header>

    <main>
      <section class="preview">
        <div id="avatar">
          <p> Your Keith will appear here!</p>
        </div>
        <button id="download">Download Keith</button>
      </section>

      <section class="customizer">
        <h2>Customize the Keith</h2>

        <label for="base">Body</label>
        <select id="base"></select>

        <label for="hair">Hair</label>
        <select id="hair"></select>

        <label for="eyes">Eyes</label>
        <select id="eyes"></select>

        <label for="mouth">Mouth</label>
        <select id="mouth"></select>

        <label for="clothing">Clothing</label>
        <select id="clothing"></select>

        <label for="accessories">Accesories</label>
        <select id="accessories"></select>

        <label for="effects">Effects</label>
        <select id="effects"></select>

        <label for="hand">Hand</label>
        <select id="hand"></select>
      </section>
    </main>

  </script src="script.js"></script>
  </body>
</html>
